function whenFor(c,dateIso,off){const total=c.time+(off-5.5)*60;const shift=Math.floor(total/1440);return {date:addDays(dateIso,shift),time:ft(total)}}
function topicOf(c){return c.course==='INR'?'The Need of Religion':BELIEF[c.sem-1]}
function courseLabel(c){const k=course(c.course);return k.name+(k.sems>1?' · Sem '+c.sem:'')}
function weekLabel(c,w){const k=course(c.course);return (c.course==='INR'?'Session ':'Week ')+w+' of '+k.weeks}
function verseRef(n){if(n<=0)return 'the beginning';return n<=7?'Al-Fatiha 1:'+n:'Al-Baqarah 2:'+(n-7)}
function versesBefore(c,week){return ((c.sem-1)*course(c.course).weeks+(week-1))*3}
function lesson(c,week){
  const loaded=S.charts[c.course+'-'+c.sem];const tag=c.course==='INR'?'Session ':'Week ';
  const ph=t=>loaded?'['+tag+week+' '+t+' from the syllabus chart]':'[Syllabus chart not loaded yet]';
  const b=c.course==='INR'?(INTRO[week-1]||'Course complete'):topicOf(c)+': '+ph('sub-topic');
  return {q:'Resume from '+verseRef(versesBefore(c,week)+1)+' (3 verses)',b:b,l:ph('rulings'),e:ph('topic')};
}
function stuStats(s){
  const ss=classSessions(s.classId).filter(x=>x.held&&x.logged&&x.date>=s.joined);
  let present=0;ss.forEach(x=>{if((x.att[s.id]||'a')==='p')present++});
  let miss=0;const missed=[];
  for(let i=ss.length-1;i>=0;i--){const a=ss[i].att[s.id]||'a';if(a==='e')continue;if(a==='a'){miss++;missed.push(ss[i])}else break}
  const isNew=daysAgo(s.joined)<=14;
  const status=miss>=4?'followup':miss>=2?'risk':isNew?'new':'active';
  return {pct:ss.length?Math.round(present/ss.length*100):null,miss,missed,status,present,counted:ss.length};
}
const STAT={new:['gold','New'],active:['ok','Active'],risk:['warn','At risk'],followup:['warnfill','In follow-up']};
const chip=(k,t)=>'<span class="chip '+k+'">'+esc(t)+'</span>';
const statChip=k=>chip(STAT[k][0],STAT[k][1]);
function best(sid,crs,sem,sub){const r=S.results.filter(r=>r.sid===sid&&r.course===crs&&r.sem===sem&&r.sub===sub);return r.length?Math.max.apply(null,r.map(x=>x.pct)):null}
function semResult(sid,crs,sem){const m=['b','l','e'].map(k=>best(sid,crs,sem,k));if(m.some(x=>x===null))return m.every(x=>x===null)?'none':'incomplete';return m.every(x=>x>=50)?'pass':'fail'}
function classAtt(cid,since,until){let p=0,n=0;classSessions(cid).filter(x=>x.held&&x.logged&&(!since||x.date>=since)&&(!until||x.date<=until)).forEach(x=>Object.keys(x.att).forEach(k=>{n++;if(x.att[k]==='p')p++}));return n?Math.round(p/n*100):null}
function locMetrics(code){
  const cs=S.classes.filter(c=>c.loc===code);const ids=cs.map(c=>c.id);
  const ss=S.sessions.filter(x=>ids.includes(x.classId));
  const studs=S.students.filter(s=>ids.includes(s.classId));const st=studs.map(stuStats);
  const cut=addDays(TODAY,-28);let p=0,n=0;
  ss.filter(x=>x.held&&x.logged&&x.date>=cut).forEach(x=>Object.keys(x.att).forEach(k=>{n++;if(x.att[k]==='p')p++}));
  let pass=0,tot=0;
  cs.forEach(c=>{for(let sem=1;sem<=c.sem;sem++){if(!S.published[c.id+'|'+sem])continue;classStudents(c.id).forEach(s=>{const r=semResult(s.id,c.course,sem);if(r==='pass'||r==='fail'){tot++;if(r==='pass')pass++}})}});
  const unlogged=ss.filter(x=>x.held&&!x.logged);
  return {classes:cs.length,students:studs.length,held:ss.filter(x=>x.held).length,planned:ss.length,att:n?Math.round(p/n*100):null,
    pass:tot?Math.round(pass/tot*100):null,unlogged:unlogged,old:unlogged.filter(x=>daysAgo(x.date)>7).length,
    risk:st.filter(x=>x.status==='risk').length,fu:st.filter(x=>x.status==='followup').length,
    awaiting:cs.filter(c=>c.status==='awaiting').length,
    calls:S.calls.slice(-4).filter(c=>c.status==='Held').length,actions:S.actions.filter(a=>!a.done).length};
}
function pendingResults(code){
  const out=[];S.classes.filter(c=>c.loc===code).forEach(c=>{for(let sem=1;sem<=c.sem;sem++){
    if(S.published[c.id+'|'+sem])continue;const ids=classStudents(c.id).map(s=>s.id);
    const taken=ids.filter(id=>semResult(id,c.course,sem)!=='none').length;
    if(taken)out.push({c:c,sem:sem,taken:taken,total:ids.length})}});
  return out;
}

const weekStart=d=>{const t=pd(d);return addDays(d,-((t.getDay()+6)%7))};
const thisWeek=()=>weekStart(TODAY);const lastWeek=()=>addDays(weekStart(TODAY),-7);
const wkLabel=w=>fd(w)+' to '+fd(addDays(w,6));
const TG=()=>({ayat:+S.targets.ayat||0,pages:+S.targets.pages||0});
const rd=(sid,w)=>S.reading.find(r=>r.sid===sid&&r.week===w);
const metBoth=e=>{const t=TG();return !!e&&e.ayat>=t.ayat&&e.pages>=t.pages};
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
(function(){
  let seed=11;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const weeks=[-35,-28,-21,-14,-7].map(n=>addDays(weekStart(TODAY),n));
  S.students.forEach(s=>{const c=cls(s.classId);if(!c||(c.loc!=='MUM'&&c.teacherId!=='t1')||c.course==='INR')return;
    const st=stuStats(s);
    weeks.forEach((w,i)=>{
      if(addDays(w,6)<s.joined)return;
      if(s.id==='zainab'&&i===4)return;
      if((st.status==='followup'&&i>=2)||(st.status==='risk'&&i>=3)||rnd()<0.15)return;
      const ayat=Math.min(520,Math.round((0.85+rnd()*0.4)*35)*10);const pages=Math.round((0.85+rnd()*0.4)*70);
      S.reading.push({sid:s.id,week:w,ayat:s.id==='zainab'?[350,380,320,350][i]:ayat,pages:s.id==='zainab'?[70,64,72,58][i]:pages,book:c.id==='MUM-BAS-003'?'m10':''})})});
})();

    '<p class="sub small">'+(dated?'Period: '+fd(from)+' to '+fd(to)+'. Sessions, attendance and calls count this period only; student status is as of today.':'This report shows the position as of today. In the full system it will also follow the start and end dates; the sample records here carry no dates for it.')+'</p>'+
    body+'</section>';

const QTYPE={single:'Single choice',combo:'Statements with combinations',fill:'Fill in the blank',bank:'Fill in the blanks from a word bank',match:'Match the column',ayah:'Arabic verse and translation'};
const isAr=s=>/[؀-ۿ]/.test(String(s));

function qShow(q){
  if(q.type==='fill')return '<div class="small">Accepted answers: <span class="c">'+q.answers.map(esc).join(', ')+'</span></div>';
  if(q.type==='match')return '<ol>'+q.left.map((l,i)=>'<li>'+esc(l)+' <span class="sub">matches</span> <span class="c">'+esc(q.right[i])+'</span></li>').join('')+'</ol>';

function qFields(t,q){
  const v=x=>esc(x==null?'':x);let s='';const choice=t==='single'||t==='ayah'||t==='combo';
  if(t==='ayah')s+='<div class="field"><label for="qa-ar">Ayat in Arabic</label><textarea id="qa-ar" name="ar" rows="2" dir="rtl" lang="ar" class="ar" required>'+v(q&&q.ar)+'</textarea></div>';
  const lab=t==='ayah'?'Instruction':t==='fill'?'Sentence, with ____ where the blank goes':t==='match'?'Instruction':'Question';
  const def=t==='ayah'?'Select the translation of this ayat.':t==='match'?'Match each term to its meaning.':'';
  s+='<div class="field"><label for="qa-t">'+lab+'</label><textarea id="qa-t" name="text" rows="'+(t==='single'?3:2)+'" required>'+v(q?q.text:def)+'</textarea></div>';
  if(choice){
    s+=['A','B','C','D'].map((L,i)=>'<div class="field"><label for="qa-o'+i+'">'+(t==='ayah'?'Translation ':'Option ')+L+'</label><input id="qa-o'+i+'" name="o'+i+'" value="'+v(q&&q.options[i])+'" required></div>').join('')+
      '<div class="field"><label for="qa-c">Correct answer</label><select id="qa-c" name="correct">'+opts([[0,'A'],[1,'B'],[2,'C'],[3,'D']],q?q.correct:0)+'</select></div>';

  if(t==='fill')s+='<div class="field"><label for="qa-a">Accepted answers, separated by commas</label><input id="qa-a" name="answers" value="'+v(q&&q.answers.join(', '))+'" required></div><p class="sub small">Capitals, spaces and apostrophes are ignored when marking, so Maad and Ma\'ad count as the same answer.</p>';
  if(t==='match')s+=[0,1,2,3].map(i=>'<div class="form"><div class="field"><label for="qa-l'+i+'">Left '+(i+1)+'</label><input id="qa-l'+i+'" name="l'+i+'" value="'+v(q&&q.left[i])+'"'+(i<2?' required':'')+'></div><div class="field"><label for="qa-r'+i+'">Its match</label><input id="qa-r'+i+'" name="r'+i+'" value="'+v(q&&q.right[i])+'"'+(i<2?' required':'')+'></div></div>').join('')+'<p class="sub small">Enter each pair side by side. Students see the right-hand column shuffled.</p>';
  return s;
}

const norm=s=>String(s==null?'':s).toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
function isAns(q,a){if(q.type==='match')return !!a&&a.every(x=>x!=='');if(q.type==='fill')return !!(a&&String(a).trim());return a!==undefined&&a!==null}
function qScore(q,a){
  if(!isAns(q,a))return 0;
  if(q.type==='match')return a.filter((x,i)=>x!==''&&+x===i).length/q.left.length;
  if(q.type==='fill'){const n=norm(a);return q.answers.some(x=>norm(x)===n)?1:0}
  return a===q.correct?1:0;
}
function examLight(){
  const e=S.exam;if(!e)return;const n=e.qs.filter((q,i)=>isAns(q,e.ans[i])).length;

  const b=document.getElementById('ex-submit');if(b)b.disabled=n<e.qs.length;
}

  closeAction(id){S.actions.find(a=>a.id===id).done=true;toast('Action item closed')},
  assignOpen(cid){const c=cls(cid);const l=S.teachers.filter(t=>t.g===c.g);S.form={teacher:l[0].id};S.modal={t:'assign',cid:cid}},
  assignSave(cid){const c=cls(cid);c.teacherId=S.form.teacher;c.status='active';S.modal=null;toast(teacherName(c.teacherId)+' assigned. '+cid+' is now active.')},
  classNew(){S.form={course:'BAS',sem:1,g:'F',day:1,time:'20:00',teacher:'',meet:''};S.modal={t:'class'}},
  classSave(){const f=S.form;const t=(f.time||'20:00').split(':').map(Number);const can=S.role==='locadmin';const id='MUM-'+f.course+'-'+String(nextCounter('MUM',f.course)).padStart(3,'0');
    const tid=can&&f.teacher&&S.teachers.some(x=>x.id===f.teacher&&x.g===f.g)?f.teacher:null;
    S.classes.push({id:id,loc:'MUM',course:f.course,sem:Math.min(+f.sem||1,course(f.course).sems),g:f.g,teacherId:tid,day:+f.day,time:t[0]*60+(t[1]||0),status:tid?'active':'awaiting',createdBy:me().person,createdOn:TODAY,meet:f.meet});
    S.modal=null;toast(id+' created'+(tid?' with '+teacherName(tid):' and saved as awaiting teacher'))},
  allocOpen(rid){const r=S.regs.find(x=>x.id===rid);const l=S.classes.filter(c=>c.g===r.g).sort((a,b)=>(a.course===r.course?0:1)-(b.course===r.course?0:1));S.form={cid:l[0].id};S.modal={t:'alloc',rid:rid}},
  allocSave(rid){const r=S.regs.find(x=>x.id===rid);S.students.push({id:'s'+(++nS),name:r.name,g:r.g,classId:S.form.cid,joined:TODAY,p:.9,city:r.city});S.regs=S.regs.filter(x=>x.id!==rid);S.modal=null;toast(r.name+' added to '+S.form.cid+' with status New')},
  callOpen(){S.form={status:'Held',text:'',owner:'Br. Jafar',due:addDays(TODAY,7)};S.modal={t:'call'}},
  callSave(){const f=S.form;S.calls.push({date:S.nextCall,status:f.status});S.nextCall=addDays(S.nextCall,7);if(f.text&&f.text.trim())S.actions.push({id:'a'+Date.now(),text:f.text.trim(),owner:f.owner,due:f.due||addDays(TODAY,7),done:false,rem:0});S.modal=null;toast('Call recorded as '+f.status.toLowerCase()+(f.text&&f.text.trim()?' with one action item':''))},
  reminder(sid){S.modal={t:'reminder',sid:sid}},
  cert(key){S.modal={t:'cert',key:key}},
  modalClose(){S.modal=null},
  pref(key){S.prefs[key]=!S.prefs[key];if(key==='absence'&&!S.prefs[key])toast('Absence reminders are off. Your teacher is still told if you miss classes.')},
  logOpen(sid){const x=S.sessions.find(s=>s.id===sid);const c=cls(x.classId);S.back={view:S.view,p:S.p};S.draft={sid:sid,held:true,reason:'',verse:verseRef(versesBefore(c,x.week)+3),covered:{b:true,l:true,e:true},att:{},note:''};go('log')},
  logHeld(v){S.draft.held=v==='1'},
  logAtt(arg){const a=arg.split('|');S.draft.att[a[0]]=a[1]},
  logSave(){const d=S.draft;const x=S.sessions.find(s=>s.id===d.sid);const c=cls(x.classId);const studs=classStudents(c.id).filter(s=>s.joined<=x.date);
    x.logged=true;x.held=d.held;x.reason=d.reason;x.verse=d.verse;x.loggedBy=me().person+(S.role==='student'?' (assistant)':S.role==='locadmin'?' (for the teacher)':'');
    let p=0;if(d.held){studs.forEach(s=>{const v=d.att[s.id]||'p';x.att[s.id]=v;if(v==='p')p++})}else{x.week=null}
    S.draft=null;A.back();toast(d.held?'Saved. '+p+' of '+studs.length+' present.':'Saved as cancelled.')},
  examStart(id){const e=S.exams.find(x=>x.id===id);const qs=S.questions.filter(q=>!q.retired&&q.course===e.course&&q.sem===e.sem&&q.sub===e.sub);if(!qs.length){toast('This exam has no questions yet');return}const sh=n=>{const a=Array.from({length:n},(_,i)=>i);for(let t=0;t<5;t++){for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const x=a[i];a[i]=a[j];a[j]=x}if(n<2||a.some((v,i)=>v!==i))break}return a};
    S.exam={examId:id,i:0,qs:qs,ans:qs.map(q=>q.type==='match'?q.left.map(()=>''):undefined),order:qs.map(q=>q.type==='match'?sh(q.right.length):null)};go('exam')},
  examPick(j){S.exam.ans[S.exam.i]=+j},
  examGo(n){S.exam.i=Math.max(0,Math.min(S.exam.qs.length-1,S.exam.i+ +n));window.scrollTo(0,0)},
  examSubmit(){const e=S.exam;const ex=S.exams.find(x=>x.id===e.examId);const right=e.qs.reduce((t,q,i)=>t+qScore(q,e.ans[i]),0);const s=stu('zainab');
    S.results.push({sid:s.id,cid:s.classId,course:ex.course,sem:ex.sem,sub:ex.sub,pct:Math.round(right/e.qs.length*100),attempt:1});S.exam=null;go('exams');S.modal={t:'done'}},
  overlay(_,el,ev){if(ev.target===el)S.modal=null}
};
const F={
  locAdd(d){const code=d.code.trim().toUpperCase();if(S.locations.some(l=>l.code===code)){S.p.err='The short code '+code+' is already used. Choose another.';return}
    S.locations.push({code:code,name:d.name.trim(),primary:d.primary.trim(),secondary:d.secondary.trim(),coordinator:d.coordinator.trim()||'None yet',callDay:d.callDay,callTime:d.callTime});S.locations.sort((a,b)=>a.name<b.name?-1:1);S.p.err='';toast(d.name.trim()+' added with code '+code)},
  courseAdd(d){const code=d.code.trim().toUpperCase();if(S.courses.some(c=>c.code===code)){toast('That code is already used');return}S.courses.push({code:code,name:d.name.trim(),sems:+d.sems||1,weeks:+d.weeks||1});toast(d.name.trim()+' added')},
  subjectAdd(d){S.subjects.push({key:'x'+S.subjects.length,name:d.name.trim(),min:+d.min||10,exam:false});toast(d.name.trim()+' added')},
  rdSave(d){const w=S.form.rd.week;const t=TG();let e=rd('zainab',w);if(!e){e={sid:'zainab',week:w};S.reading.push(e)}e.ayat=+d.ayat;e.pages=+d.pages;e.book=d.book||'';
    toast('Saved for '+wkLabel(w)+': '+e.ayat+' of '+t.ayat+' ayat, '+e.pages+' of '+t.pages+' pages.')},
  matAdd(d){const f=d.file&&d.file.name?d.file.name:'';S.materials.unshift({id:'m'+Date.now(),title:d.title.trim(),type:d.type,course:d.course,sem:+d.sem,sub:d.sub,week:d.week?+d.week:null,pages:d.pages?+d.pages:null,share:d.share==='true',src:f||d.link.trim()||'No file attached',date:TODAY});toast('Added to the library')},
  trainAdd(d){const t=(d.time||'11:00').split(':').map(Number);S.trainings.push({id:'tr'+Date.now(),title:d.title.trim(),kind:d.kind,course:d.course,sem:+d.sem,date:d.date,time:t[0]*60+(t[1]||0),mode:d.mode.trim()||'Online on Google Meet',facilitator:d.facilitator.trim()||'Academic team',req:!!d.req,rsvp:{},attended:null});
    const n=S.teachers.filter(x=>invited(x.id,S.trainings[S.trainings.length-1])).length;toast('Scheduled. '+n+' teachers invited by email and WhatsApp.')},
  qAdd(d){const f=S.form.qb;const ex=f.edit?S.questions.find(x=>x.id===f.edit):null;const t=ex?ex.type:f.type||'single';const q={text:d.text.trim()};
    if(t==='single'||t==='ayah'||t==='combo'){q.options=[d.o0,d.o1,d.o2,d.o3].map(x=>x.trim());q.correct=+d.correct;if(t==='ayah')q.ar=d.ar.trim()}
    if(t==='fill')q.answers=d.answers.split(',').map(x=>x.trim()).filter(Boolean);
    if(t==='match'){q.left=[];q.right=[];for(let i=0;i<4;i++){if(d['l'+i].trim()&&d['r'+i].trim()){q.left.push(d['l'+i].trim());q.right.push(d['r'+i].trim())}}}
    if(ex){Object.assign(ex,q);f.edit=null;toast('Question updated')}else{addQ(f.course,+f.sem,f.sub,q.text,q.options||[],q.correct||0,Object.assign({type:t},q));toast('Question saved. Add the next one.')}},
  tradAdd(d){S.traditions.push({id:'h'+Date.now(),text:d.text.trim(),source:d.source.trim()});toast('Added to the library')},
  actionAdd(d){S.actions.push({id:'a'+Date.now(),text:d.text.trim(),owner:d.owner,due:d.due||addDays(TODAY,7),done:false,rem:0});toast('Action item added')}
};
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el||el.disabled)return;
  if(el.dataset.act==='overlay'&&ev.target!==el)return;
  const fn=A[el.dataset.act];if(!fn)return;fn(el.dataset.arg,el,ev);render();
});
document.addEventListener('submit',ev=>{
  const f=ev.target.closest('[data-form]');if(!f)return;ev.preventDefault();
  F[f.dataset.form](Object.fromEntries(new FormData(f)));render();
});
function onInput(ev){
  const el=ev.target;
  if(el.id==='role-select'){if(ev.type!=='change')return;S.role=el.value;document.getElementById('toast').hidden=true;S.modal=null;S.draft=null;S.exam=null;S.back=null;S.form={};S.tab=null;go(TABS[S.role][0][0]);render();return}
  if(!el.dataset||!el.dataset.bind)return;
  setPath(el.dataset.bind,el.type==='checkbox'?el.checked:el.value);
  if(el.dataset.bind.indexOf('exam.')===0)examLight();
  if(el.dataset.rerender&&ev.type==='change')render();
}
document.addEventListener('input',onInput);
document.addEventListener('change',onInput);
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.modal){S.modal=null;render()}});
render();
})();
</script>

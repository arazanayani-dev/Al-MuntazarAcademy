<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Almuntazar Canada</title>
<meta name="description" content="Classes, attendance, exams, materials and coordination for Almuntazar Canada">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Lora:wght@400;500;600&family=Amiri:wght@400;700&display=swap">
<link rel="icon" type="image/svg+xml" href="/img/mark.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta name="theme-color" content="#134845">
<link rel="stylesheet" href="/css/app.css">
<script>
/* Apply the saved light or dark choice before the page draws, so it never flashes the wrong colours */
(function () {
  var t = null; try { t = localStorage.getItem('am-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="/js/app.js"></script>
<script>
/* If the app's scripts fail to load at all, say so instead of showing "Loading…" forever */
setTimeout(function () {
  if (window.__amStarted) return;
  var el = document.getElementById('app');
  if (el) el.innerHTML = '<div class="loading"><p><b>The app could not load.</b></p><p>Please check your internet connection and try again.</p><p><button class="btn primary" type="button" onclick="location.reload()">Try again</button></p></div>';
}, 20000);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Almuntazar Academy</title>
<meta name="description" content="Classes, attendance, exams, materials and coordination for Almuntazar Academy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Marcellus&family=Amiri:wght@400;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script>
/* Apply the saved light or dark choice before the page draws, so it never flashes the wrong colours */
(function () {
  var t = null; try { t = localStorage.getItem('am-theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
